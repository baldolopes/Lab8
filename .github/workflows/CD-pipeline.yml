name: CD pipeline

on:
  workflow_run:
    workflows: ["CI pipeline"]
    types:
      - completed

jobs:
  Deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply Kubernetes Configurations to Minikube
        run: |
          kubectl apply -f deployment.yaml

      - name: Trigger Rollout Restart for New Image
        run: |
          kubectl rollout restart deployment/calculator-app
          kubectl rollout status deployment/calculator-app
